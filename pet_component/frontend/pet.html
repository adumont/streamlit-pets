<div class="pet-root" data-state="idle" data-pixelated="true">
  <div
    class="pet-stage"
    role="button"
    tabindex="0"
    aria-label="Mascota interactiva. Haz click o pulsa Enter para acariciarla."
  >
    <div class="pet-bubble" aria-live="polite"></div>
    <div class="pet-fx" aria-hidden="true"></div>
    <div class="pet-glow" aria-hidden="true"></div>

    <svg class="pet-svg" viewBox="0 0 220 250" aria-hidden="true">
      <defs>
        <linearGradient id="petBodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe6c7" />
          <stop offset="1" stop-color="#f7c59f" />
        </linearGradient>
        <radialGradient id="petBellyGrad" cx="0.5" cy="0.35" r="0.7">
          <stop offset="0" stop-color="#fffaf3" />
          <stop offset="1" stop-color="#fff1df" />
        </radialGradient>
      </defs>

      <ellipse class="pet-shadow" cx="110" cy="230" rx="62" ry="11" />

      <g class="pet-body">
        <!-- tail -->
        <path
          class="pet-tail"
          d="M 168 186 C 202 184 208 154 196 136 C 190 126 178 122 170 129"
          fill="none"
          stroke="#f2a65a"
          stroke-width="13"
          stroke-linecap="round"
        />

        <!-- ears -->
        <path
          class="pet-ear"
          d="M 60 78 L 47 30 C 45 21 53 17 60 24 L 94 59 Z"
          fill="#f4a261"
          stroke="#5b3a29"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <path d="M 63 68 L 55 39 L 80 59 Z" fill="#ffc2b4" />
        <path
          class="pet-ear"
          d="M 160 78 L 173 30 C 175 21 167 17 160 24 L 126 59 Z"
          fill="#f4a261"
          stroke="#5b3a29"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <path d="M 157 68 L 165 39 L 140 59 Z" fill="#ffc2b4" />

        <!-- feet -->
        <ellipse cx="79" cy="214" rx="26" ry="14" fill="#f2a65a" stroke="#5b3a29" stroke-width="5" />
        <ellipse cx="141" cy="214" rx="26" ry="14" fill="#f2a65a" stroke="#5b3a29" stroke-width="5" />

        <!-- body -->
        <path
          d="M 110 46 C 158 46 186 88 186 140 C 186 192 156 220 110 220 C 64 220 34 192 34 140 C 34 88 62 46 110 46 Z"
          fill="url(#petBodyGrad)"
          stroke="#5b3a29"
          stroke-width="5"
        />
        <ellipse cx="110" cy="172" rx="44" ry="35" fill="url(#petBellyGrad)" opacity="0.9" />
        <ellipse cx="110" cy="112" rx="55" ry="43" fill="#fff7ec" opacity="0.42" />

        <!-- eyes -->
        <g class="pet-eyes">
          <ellipse cx="84" cy="118" rx="9.5" ry="12" fill="#3b2a24" />
          <ellipse cx="136" cy="118" rx="9.5" ry="12" fill="#3b2a24" />
          <g class="pet-pupils">
            <circle cx="86.5" cy="114.5" r="3.4" fill="#fff" />
            <circle cx="138.5" cy="114.5" r="3.4" fill="#fff" />
          </g>
        </g>

        <!-- closed eyes -->
        <g class="pet-sleep-eyes">
          <path d="M 74 118 q 10 8 20 0" fill="none" stroke="#3b2a24" stroke-width="4" stroke-linecap="round" />
          <path d="M 126 118 q 10 8 20 0" fill="none" stroke="#3b2a24" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- cheeks -->
        <ellipse cx="66" cy="140" rx="12" ry="7" fill="#f7a8a8" opacity="0.75" />
        <ellipse cx="154" cy="140" rx="12" ry="7" fill="#f7a8a8" opacity="0.75" />

        <!-- mouth -->
        <path class="pet-mouth" d="M 103 136 q 7 8 14 0" fill="none" stroke="#5b3a29" stroke-width="3" stroke-linecap="round" />
        <path class="pet-mouth-sad" d="M 103 143 q 7 -8 14 0" fill="none" stroke="#5b3a29" stroke-width="3" stroke-linecap="round" />

        <!-- whiskers -->
        <g stroke="#5b3a29" stroke-width="2.5" stroke-linecap="round" opacity="0.42">
          <path d="M 52 128 L 30 123" />
          <path d="M 52 136 L 28 138" />
          <path d="M 168 128 L 190 123" />
          <path d="M 168 136 L 192 138" />
        </g>

        <!-- paws -->
        <ellipse class="pet-paw pet-paw-left" cx="54" cy="176" rx="15" ry="10" fill="#f4a261" stroke="#5b3a29" stroke-width="4.5" />
        <ellipse class="pet-paw pet-paw-right" cx="166" cy="174" rx="15" ry="10" fill="#f4a261" stroke="#5b3a29" stroke-width="4.5" />

        <!-- sad tear -->
        <path class="pet-tear" d="M 151 128 q 6 9 0 13 q -6 -4 0 -13" fill="#7cc7ff" />

        <!-- review sparkle -->
        <g class="pet-sparkle" fill="#ffd166">
          <path d="M 178 78 l 4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" />
          <path d="M 198 108 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" />
        </g>
      </g>
    </svg>

    <canvas class="pet-canvas" aria-hidden="true"></canvas>

    <div class="pet-zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
    <div class="pet-speed" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="pet-hint" aria-hidden="true">click me</div>
  </div>
</div>
